{% if posts %}
    <ul>
    {% for post in posts %}
        <li>
            <a href="{% url 'blog:details' post.id %}">{{ post.title }}</a><br>
            <small>Created: {{ post.created_at|date:"d M Y, H:i" }}</small><br>
            <small>Maintainer: {% if post.maintainer %}{{ post.maintainer }}{% else %}None{% endif %}</small>
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>No posts found.</p>
{% endif %}
